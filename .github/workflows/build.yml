# .github/workflows/build.yml
name: Build NSSM-PLUS

# 触发条件：代码推送到 main 或 master 分支，或手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许从 Actions 标签页手动触发

jobs:
  build:
    # 使用最新的 Windows 运行器
    runs-on: windows-latest

    steps:
      # 1. 拉取代码（升级到 v5）
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive  # 如果项目有子模块，一并拉取

      # 2. 设置 Go 环境（升级到 v6）
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      # 3. 设置 Node.js 环境（升级到 v5）
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 4. 安装 Wails CLI
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # 5. 下载 Go 模块依赖
      - name: Download Go dependencies
        run: go mod download

      # 6. 安装前端依赖
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          cd ..

      # 7. 执行 Wails 构建，生成 EXE 文件
      - name: Build Wails app
        run: wails build -o nssm-plus.exe -clean

      # 8. 上传构建产物（升级到 v5）
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nssm-plus-windows
          path: build/bin/nssm-plus.exe
