# .github/workflows/build.yml
name: Build NSSM-PLUS

# 触发条件：当代码被推送到 main 或 master 分支时，或手动触发时运行
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许从 Actions 标签页手动触发

jobs:
  build:
    # 在最新的 Windows 运行器上执行
    runs-on: windows-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果项目有子模块，一并拉取

      # 2. 设置 Go 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'  # 使用 Go 1.22 版本[reference:1]

      # 3. 设置 Node.js 环境 (Wails 需要)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 4. 安装 Wails CLI
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # 5. 下载 Go 模块依赖
      - name: Download Go dependencies
        run: go mod download

      # 6. 安装前端依赖
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          cd ..

      # 7. 执行 Wails 构建，生成 EXE 文件
      - name: Build Wails app
        run: wails build -o nssm-plus.exe -clean

      # 8. 上传构建产物 (EXE 文件)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nssm-plus-windows
          path: build/bin/nssm-plus.exe
